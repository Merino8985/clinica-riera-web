<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clínica Riera · Psicología</title>
  <meta name="description" content="Clínica Riera, psicología. Nuestra web está en construcción. Escríbenos por WhatsApp para pedir cita.">
  <meta name="robots" content="noindex">

  <link rel="icon" type="image/png" href="img/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">

  <style>
    /* ===== Colores de la marca ===== */
    :root {
      --fondo: #FAF7F2;
      --moka: #8A6848;
      --moka-oscuro: #74573C;
      --texto: #3B2F25;
      --texto-suave: #5A4C3E;
      --linea: #E4D9CA;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }

    body {
      background: var(--fondo);
      color: var(--texto);
      font-family: "Montserrat", system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      text-align: center;
    }

    main {
      max-width: 560px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      animation: aparecer 1.2s ease both;
    }

    @keyframes aparecer {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: none; }
    }

    .logo { width: min(340px, 80vw); height: auto; }

    h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 400;
      font-size: clamp(30px, 6vw, 44px);
      line-height: 1.15;
      margin: 0;
    }
    h1 em { color: var(--moka); }

    p { margin: 0; font-size: 16px; line-height: 1.7; color: var(--texto-suave); }

    .contacto { display: flex; flex-direction: column; align-items: center; gap: 10px; padding-top: 6px; }

    .etiqueta { font-size: 12px; letter-spacing: .24em; text-transform: uppercase; color: var(--moka); }

    .telefono {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(30px, 7vw, 40px);
      color: var(--texto);
      text-decoration: none;
      letter-spacing: .04em;
    }
    .telefono:hover { color: var(--moka); }

    .boton {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 6px;
      background: var(--moka);
      color: #fff;
      text-decoration: none;
      padding: 15px 30px;
      border-radius: 999px;
      font-size: 13px;
      letter-spacing: .14em;
      text-transform: uppercase;
      transition: background .2s;
    }
    .boton:hover { background: var(--moka-oscuro); }

    footer {
      font-size: 12px;
      color: #8C7D6B;
      padding-top: 18px;
      border-top: 1px solid var(--linea);
      width: 100%;
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="img/logo-clinica-riera.png" alt="Clínica Riera · Psicología">

    <h1>Estamos preparando <em>nuestra nueva web</em></h1>
    <p>Muy pronto podrás conocernos aquí. Mientras tanto, estaremos encantadas de atenderte por WhatsApp o por teléfono.</p>

    <div class="contacto">
      <span class="etiqueta">Pide tu cita</span>
      <a class="telefono" href="tel:+34629176679">629 17 66 79</a>
      <a class="boton" href="https://wa.me/34629176679?text=Hola%2C%20me%20gustar%C3%ADa%20pedir%20informaci%C3%B3n%20sobre%20una%20cita." target="_blank" rel="noopener">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.4.8 3.2.6a2.8 2.8 0 0 0 1.8-1.3 2.3 2.3 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg>
        Contacta por WhatsApp
      </a>
    </div>

    <footer>© 2026 Clínica Riera · Psicología</footer>
  </main>
</body>
</html>
